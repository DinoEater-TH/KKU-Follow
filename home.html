<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><meta name="theme-color" content="#1a56db"><title>หน้าหลัก — KKU Follow</title>
<link rel="stylesheet" href="css/style.css"><link rel="manifest" href="manifest.json"><link rel="icon" href="assets/icon-192.png"><link rel="apple-touch-icon" href="assets/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
</head><body><div class="page-container">
<div class="page-header"><h1>KKU Follow</h1><div style="flex:1;"></div><span id="userNameDisplay" style="font-size:0.8125rem;opacity:0.9;"></span><button id="historyBtn" class="back-btn" title="ประวัติ" style="font-size:1.25rem;">📋</button><button id="logoutBtn" class="back-btn" title="ออกจากระบบ" style="font-size:1.1rem;">🚪</button></div>
<div class="page-content">
<div class="mic-container"><button id="micBtn" class="mic-btn" title="กดเพื่อบันทึกเสียง">🎙️</button><div id="micStatus" class="mic-status">กดปุ่มเพื่อเริ่มบันทึกเสียง</div></div>
<div id="notSupported" class="hidden empty-state"><div class="icon">⚠️</div><p>เบราว์เซอร์ของคุณไม่รองรับการบันทึกเสียง<br>กรุณาใช้ Chrome บนมือถือหรือคอมพิวเตอร์</p></div>
<div id="resultSection" class="hidden"><h3 style="margin-bottom:8px;font-size:0.9375rem;color:var(--color-gray-600);">ข้อความที่ได้:</h3><div id="transcriptBox" class="transcript-box"></div><div class="flex gap-2 mt-4"><button id="retryBtn" class="btn btn-secondary" style="flex:1;">ลองใหม่</button><button id="nextBtn" class="btn btn-primary" style="flex:1;">วิเคราะห์ด้วย AI</button></div></div>
</div></div>
<script src="js/app.js"></script><script src="js/auth.js"></script><script src="js/api.js"></script><script src="js/ui.js"></script><script src="js/voice.js"></script>
<script>document.addEventListener('DOMContentLoaded',function(){if(!Auth.isAuthenticated()&&!sessionStorage.getItem('kku_token')){KKU.navigateTo('login');return;}var u=KKU.State.user||JSON.parse(sessionStorage.getItem('kku_user')||'{}');if(u.name)document.getElementById('userNameDisplay').textContent=u.name;document.getElementById('logoutBtn').addEventListener('click',function(){Auth.logout();});document.getElementById('historyBtn').addEventListener('click',function(){KKU.navigateTo('history');});});</script>
</body></html>
