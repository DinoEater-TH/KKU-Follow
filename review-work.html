<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><meta name="theme-color" content="#1a56db"><title>ตรวจสอบงาน — KKU Follow</title>
<link rel="stylesheet" href="css/style.css"><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
</head><body><div class="page-container">
<div class="page-header"><button class="back-btn" onclick="history.back()">←</button><h1>ตรวจสอบงาน</h1></div>
<div class="page-content"><p class="text-sm" style="color:var(--color-gray-500);margin-bottom:16px;">ตรวจสอบและแก้ไขข้อมูลก่อนบันทึก</p>
<form id="reviewForm">
<div class="form-group"><label class="form-label">วันที่ปฏิบัติงาน</label><input type="date" id="workDate" class="form-input" required></div>
<div class="flex gap-2"><div class="form-group" style="flex:1;"><label class="form-label">เวลาเริ่ม</label><input type="time" id="startTime" class="form-input"></div><div class="form-group" style="flex:1;"><label class="form-label">เวลาสิ้นสุด</label><input type="time" id="endTime" class="form-input"></div></div>
<div class="form-group"><label class="form-label">สถานที่</label><input type="text" id="location" class="form-input" placeholder="เช่น ตึกอธิการ"></div>
<div class="form-group"><label class="form-label">ประเภทงาน</label><input type="text" id="workType" class="form-input" placeholder="เช่น ถ่ายภาพ, ประชุม"></div>
<div class="form-group"><label class="form-label">รายละเอียด</label><textarea id="description" class="form-textarea" placeholder="รายละเอียดเพิ่มเติม"></textarea></div>
<button type="submit" id="saveBtn" class="btn btn-primary btn-block mt-4">บันทึกงาน</button>
</form>
<div class="mt-4"><label class="form-label" style="color:var(--color-gray-400);">ข้อความต้นฉบับ</label><div id="rawTranscript" class="transcript-box placeholder" style="font-size:0.875rem;"></div></div>
</div></div>
<script src="js/app.js"></script><script src="js/api.js"></script><script src="js/ui.js"></script></body></html>
