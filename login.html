<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a56db">
  <title>เข้าสู่ระบบ — KKU Follow</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="page-container">
    <div class="login-container">
      <div class="login-logo">
        <div class="app-icon">🎙️</div>
        <h1>KKU Follow</h1>
        <p>บันทึกงานด้วยเสียง ติดตามง่าย มีหลักฐาน</p>
      </div>

      <div id="loginError" class="hidden" style="color: var(--color-danger); text-align: center; font-size: 0.875rem; max-width: 280px;"></div>

      <!-- Google จะ render ปุ่มลงใน div นี้ -->
      <div id="googleSignInBtn" style="min-height: 44px; display: flex; justify-content: center;"></div>

      <p class="text-sm" style="color: var(--color-gray-400); margin-top: 16px; text-align: center;">
        สำหรับบุคลากร มหาวิทยาลัยขอนแก่น<br>
        ใช้บัญชี @kku.ac.th เท่านั้น
      </p>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      Auth.init();
    });
  </script>
</body>
</html>
